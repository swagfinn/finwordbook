<!DOCTYPE html>
<!--
  CS客服部門通用詞典  v1.1.0（2026-11-27）
  更新紀錄
  v1.2.0
   - Threads：內文展開後，下方出現「收合」按鈕；來源改為 Slack / Notion 圖示標籤
   - 搜尋：命中的關鍵字在結果中標色；搜尋框加 ✕ 清除鈕，Esc 也可清除
   - 複製：按鈕本身變成「✓ 已複製」1.5 秒；小螢幕提示不再被手指擋住
   - 表單：「儲存／取消」固定在視窗底部
   - 編輯 TAG：手機可長按 TAG 出現「刪除」選項（拖曳仍保留）
   - 表單：已填內容時按 ✕／取消／Esc／點視窗外，先確認是否放棄
  v1.1.1
   - Threads：點擊內文文字也能展開／收合（與右側 ▾ 按鈕相同）；點內文裡的連結或正在選取文字時不會觸發
  v1.1.0
   - Account Tag：新增 TAG 時即時比對重複（停頓 0.4 秒），內嵌提示 +「合併到原有內容」
   - Account Tag：合併畫面新增「本次新增的 TAG」欄位；原有 TAG 唯讀
   - Account Tag：Tag Name 改為自動長高多行欄位 + 即時拆分的 TAG 小標籤
   - Account Tag：編輯視窗 TAG 以單顆按鈕呈現，拖曳到垃圾桶 → 二次確認 → 更新 Google Sheet
   - Threads：新增視窗欄位順序改為 標題 → 來源 → 連結 → 內文 → 來自哪位同仁 → 關鍵字
   - Threads：內文 Slack :emoji: 短代碼即時轉成 emoji；從內文第一行自動帶入「來自哪位同仁」
   - Threads：標題／連結重複時即時提示並可一鍵「更新原有內容」
   - 所有編輯按鈕改為橘色鉛筆圖示、移到卡片右上角
   - 所有表單：除標示「選填」外皆為必填；未填時阻擋送出並由上而下引導
   - 表單改為「寫入成功後才關閉」，失敗時保留已填內容
  v1.0.0  初版（使用者提供）
-->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="v1.2.0">
<title>CS客服部門通用詞典</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='52' font-size='88' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%8C%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&family=Playfair+Display:wght@700;800&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8ecdf; --panel:#fbf2e8; --ink:#1b1714; --mute:#8a7c70; --line:#efdcc9;
  --o1:#ffb480; --o2:#f58f5b; --o3:#e8764a; --hi:#fffaf4; --sh:rgba(222,150,100,.28);
  --paper:#fffdf9; --paperink:#141210; --bad:#c2452b;
  --raise:8px 8px 22px var(--sh),-6px -6px 16px rgba(255,255,255,.85);
  --inset:inset 3px 3px 8px rgba(222,150,100,.22),inset -3px -3px 8px rgba(255,255,255,.9);
  --font:'Montserrat','Noto Sans TC',system-ui,sans-serif;
  --serif:'Playfair Display','Noto Serif TC',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#241b15; --panel:#2d231b; --ink:#f7eadc; --mute:#b09d8c; --line:#43342a; --hi:#35291f; --sh:rgba(0,0,0,.45);
  --paper:#382c21; --paperink:#f7eadc; --bad:#ff9a7a;
  --raise:8px 8px 22px rgba(0,0,0,.45),-6px -6px 16px rgba(255,255,255,.04);
  --inset:inset 3px 3px 8px rgba(0,0,0,.4),inset -3px -3px 8px rgba(255,255,255,.04);}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);min-height:100vh;padding:28px 20px 60px;
  background-image:radial-gradient(circle at 8% 8%,rgba(255,200,160,.55) 0,transparent 22%),radial-gradient(circle at 92% 92%,rgba(245,143,91,.28) 0,transparent 30%)}
.shell{max-width:1120px;margin:0 auto;background:var(--panel);border-radius:44px;box-shadow:var(--raise);padding:26px 38px 40px;position:relative;overflow:hidden;transition:opacity .6s}
body.locked .shell{opacity:0;pointer-events:none}
.blob{position:absolute;right:-120px;top:120px;width:520px;height:520px;border-radius:46% 54% 50% 50%;background:linear-gradient(145deg,var(--o1),var(--o2));opacity:.16;pointer-events:none}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative}
.logo{font-weight:800;font-size:15px;letter-spacing:.02em;border:1.5px solid var(--ink);border-radius:999px;padding:9px 20px}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:none;border:0;padding:10px 18px;border-radius:999px;cursor:pointer}
nav button[aria-selected=true]{background:linear-gradient(135deg,var(--o1),var(--o2));color:#fff;box-shadow:0 6px 14px var(--sh)}
nav button:not([aria-selected=true]):hover{box-shadow:var(--inset)}
.icon,.xbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--panel);box-shadow:var(--raise);cursor:pointer;font-size:17px;color:var(--ink)}
.icon:active,.xbtn:active{box-shadow:var(--inset)}
.icon[hidden]{display:none}
.xbtn{position:absolute;top:18px;right:20px;width:36px;height:36px;font-size:14px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.chip:focus-visible{outline:2.5px solid var(--o3);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:42px;margin-top:44px;position:relative}
.hero{position:sticky;top:24px;align-self:start}
h1{font-size:44px;line-height:1.1;margin:0 0 14px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:14px;line-height:1.7;margin:0 0 26px;max-width:34ch}
.search{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:999px;box-shadow:var(--inset);padding:6px 8px 6px 20px}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);padding:10px 0}
.search input:focus-visible{outline:none}
.search:focus-within{outline:2.5px solid var(--o3);outline-offset:2px}
.btn{font:inherit;font-size:13px;font-weight:700;color:#fff;border:0;border-radius:999px;padding:13px 26px;cursor:pointer;background:linear-gradient(135deg,var(--o1),var(--o2));box-shadow:0 8px 18px var(--sh)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:var(--raise)}
.btn.danger{background:none;color:#c2452b;box-shadow:none;padding-left:0}
.hero .btn{margin-top:22px}
.stat{margin-top:22px;font-size:12.5px;color:var(--mute);display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:#9ad07a}.dot.off{background:var(--o2)}
.list{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--panel);border-radius:28px;box-shadow:var(--raise);padding:24px 28px;position:relative}
.card>:first-child{padding-right:52px}
.card h3{margin:0 0 4px;font-size:17px;line-height:1.4;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.chip{font:inherit;font-size:12.5px;font-weight:700;border:0;cursor:pointer;color:var(--o3);background:var(--hi);box-shadow:var(--inset);border-radius:999px;padding:6px 14px}
.chip.plain{cursor:default;color:var(--mute)}
.mean{font-size:15.5px;font-weight:700;line-height:1.6;margin:0 0 12px}
.reply{background:var(--hi);box-shadow:var(--inset);border-radius:18px;padding:16px 18px;font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.mini{font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);background:var(--panel);border:0;border-radius:999px;padding:8px 16px;cursor:pointer;box-shadow:var(--raise);display:inline-block}
.mini:active{box-shadow:var(--inset)}
.mini.go{background:linear-gradient(135deg,var(--o1),var(--o2));color:#fff;box-shadow:0 6px 14px var(--sh)}
.sp{margin-left:auto}
.pen{width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;display:inline-grid;place-items:center;padding:0;color:#fff;background:linear-gradient(135deg,var(--o2),var(--o3));box-shadow:0 6px 14px var(--sh)}
.pen svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pen:active{transform:translateY(1px)}
.pen.top{position:absolute;top:18px;right:20px}
.pen.sm{width:30px;height:30px}.pen.sm svg{width:15px;height:15px}
.note{color:var(--mute);font-size:13.5px;line-height:1.7;margin:8px 0 0}
.kwline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--mute);margin:2px 0 12px}
.kwline i{font-style:italic}
.mini.sm{padding:5px 12px;font-size:12px;box-shadow:var(--inset);background:var(--hi)}
.bodywrap{display:flex;gap:10px;align-items:flex-start}
.body{flex:1;min-width:0;font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.body.open{display:block}
.body.clickable{cursor:pointer}
mark{background:rgba(245,143,91,.38);color:inherit;border-radius:4px;padding:0 2px}
.search input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.qx{flex:none;width:28px;height:28px;border-radius:50%;border:0;background:var(--hi);box-shadow:var(--raise);color:var(--ink);font-size:12px;cursor:pointer;padding:0}
.qx[hidden]{display:none}
.collapse{margin-top:10px}
.collapse[hidden]{display:none}
.plat{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink);background:var(--hi);box-shadow:var(--inset);border-radius:999px;padding:5px 14px 5px 6px}
.plat b{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:12px;line-height:1}
.plat.slack b{background:#611f69}
.plat.notion b{background:#191919;box-shadow:0 0 0 1px rgba(255,255,255,.28)}
.mini.go.copied{background:#3f8a54;box-shadow:0 6px 14px rgba(63,138,84,.3)}
.chip.copied{background:#3f8a54;color:#fff;box-shadow:none}
.chipmenu{position:fixed;z-index:310;background:var(--panel);border-radius:16px;box-shadow:var(--raise);padding:6px}
.chipmenu button{display:flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:700;color:var(--bad);background:none;border:0;padding:10px 14px;border-radius:12px;cursor:pointer;word-break:break-all;text-align:left}
.chipmenu svg{width:18px;height:18px;flex:none}
#form .acts{position:sticky;bottom:0;margin:20px -32px -30px;padding:14px 32px 30px;background:var(--panel);box-shadow:0 -10px 14px -12px var(--sh);z-index:5}
.body a{color:var(--o3);font-weight:700}
.arrow{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--panel);box-shadow:var(--raise);cursor:pointer;color:var(--ink);font-size:13px;transition:transform .2s}
.arrow[hidden]{display:none}.arrow.up{transform:rotate(180deg)}
.erow{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;color:var(--ink);background:var(--panel);border:0;border-radius:22px;box-shadow:var(--raise);padding:17px 24px;cursor:pointer;line-height:1.6;word-break:break-word}
.erow b{font-family:'Montserrat',ui-monospace,monospace;color:var(--o3)}
.erow:active{box-shadow:var(--inset)}
.paper{background:var(--paper);color:var(--paperink);border-radius:28px;box-shadow:var(--raise);padding:36px 38px 30px;font-family:'Noto Serif TC','Playfair Display',serif}
.paper h2{font-family:var(--serif);font-size:44px;font-weight:800;line-height:1.1;margin:0 0 14px;letter-spacing:-.015em;word-break:break-all;cursor:pointer}
.paper .kw{font-size:14px;font-style:italic;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.paper hr{border:0;border-top:1.5px solid currentColor;margin:20px 0 14px;opacity:.85}
.paper .line{font-size:14.5px;line-height:2}
.paper a{color:inherit;text-underline-offset:3px;word-break:break-all}
.paper .k{font:inherit;font-weight:700;background:none;border:0;padding:0;color:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:4px}
.paper .mini{font-family:var(--font);font-style:normal}
.linkbtn{font:inherit;font-weight:700;color:var(--o3);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.dup{background:var(--hi);box-shadow:var(--inset);border-radius:20px;padding:16px 18px;margin-top:14px}
.dup.hint{border-left:4px solid var(--o3);margin-top:10px}
.dup h4{margin:0 0 6px;font-size:14px}
.dup .it,.cfx .it{font-size:13px;line-height:1.7;border-top:1px solid var(--line);padding:8px 0;word-break:break-word}
.dup .it b,.cfx .it b{color:var(--o3)}
.dup p.note{margin:6px 0 0}
.cfx .it{background:var(--hi);box-shadow:var(--inset);border-radius:16px;border:0;padding:12px 16px;margin:10px 0}
.cfx p{margin:0 0 8px;font-size:14px;line-height:1.7}
.cfx ul{margin:6px 0 10px;padding-left:20px;font-size:13px;line-height:1.7;word-break:break-word}
.empty{text-align:center;color:var(--mute);padding:50px 10px;font-size:14px;line-height:1.8}
dialog{border:0;border-radius:32px;background:var(--panel);color:var(--ink);box-shadow:0 30px 80px rgba(120,60,20,.35);padding:30px 32px;width:min(560px,92vw);max-height:92vh;overflow:auto;font-family:var(--font);position:relative}
dialog#adm{width:min(940px,96vw)}
dialog::backdrop{background:rgba(60,30,10,.4);backdrop-filter:blur(3px)}
dialog h2{margin:0 0 18px;font-size:20px;padding-right:44px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin:14px 0 6px}
.req{color:var(--bad)}
input.f,textarea.f,select.f{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:var(--panel);border:0;border-radius:16px;box-shadow:var(--inset);padding:12px 16px}
textarea.f{min-height:120px;resize:vertical;line-height:1.7}
textarea.f.auto{min-height:50px;resize:none;overflow:hidden;line-height:1.6;word-break:break-all}
.fld.bad .f,.fld.bad .chipbox{outline:2px solid var(--bad);outline-offset:1px}
.ferr{color:var(--bad);font-size:12.5px;margin:5px 4px 0}
.ferr:empty{display:none}
.tagprev{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tagprev:empty{display:none}
.tagprev .chip{font-size:12px;padding:4px 11px}
.chip.plain.dupc{color:var(--bad)}
.tagrow{display:flex;gap:10px;align-items:stretch}
.chipbox{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-radius:16px;box-shadow:var(--inset);background:var(--hi);min-height:52px}
.chipbox .chip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;word-break:break-all;text-align:left}
.chipbox .chip.ro{cursor:default;touch-action:auto;color:var(--mute)}
.trash{flex:none;width:56px;border:0;border-radius:16px;background:var(--panel);box-shadow:var(--raise);cursor:pointer;display:grid;place-items:center;color:var(--ink);transition:transform .15s,background .15s}
.trash.hot{background:var(--bad);color:#fff;transform:scale(1.08)}
.dragghost{position:fixed;z-index:300;pointer-events:none;transform:translate(-50%,-50%);box-shadow:var(--raise);cursor:grabbing}
.acts{display:flex;gap:12px;margin-top:24px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:none;border:0;padding:9px 18px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:linear-gradient(135deg,var(--o1),var(--o2));color:#fff}
.tblwrap{overflow:auto;max-height:52vh;border-radius:18px;background:var(--hi);box-shadow:var(--inset);margin-top:14px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{position:sticky;top:0;background:var(--hi);font-size:12px;color:var(--mute)}
.tbl .cl{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar .f{flex:1;min-width:160px}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:400;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(248,236,223,.6);backdrop-filter:blur(14px);transition:opacity .5s}
#gate.out{opacity:0;pointer-events:none}
.gcard{background:var(--panel);border-radius:36px;box-shadow:var(--raise);padding:36px 34px 32px;width:min(440px,94vw)}
.gcard h2{margin:0 0 10px;font-size:26px}
.gcard .sub{margin-bottom:8px}
.err{color:#c2452b;font-size:13px;line-height:1.6;min-height:22px;margin:10px 4px 0}
.ver{margin-top:28px;text-align:center;font-size:11.5px;color:var(--mute)}
@media(prefers-color-scheme:dark){#gate{background:rgba(36,27,21,.65)}.err{color:#ff9a7a}}
@media(max-width:860px){.shell{padding:20px 18px 30px;border-radius:32px}main{grid-template-columns:1fr;gap:28px}.hero{position:static}h1{font-size:34px}nav{margin-left:0;width:100%}.paper{padding:26px 22px}.paper h2{font-size:32px}dialog{padding:26px 20px}}
@media(max-width:860px){#form .acts{margin:20px -20px -26px;padding:14px 20px 26px}.toast{bottom:96px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gt">
  <form class="gcard" id="gateForm" novalidate>
    <div class="logo" style="display:inline-block;margin-bottom:22px">CS客服部門通用詞典</div>
    <h2 id="gt">先驗證公司信箱</h2>
    <p class="sub">請輸入公司 Email 後進入。</p>
    <label for="gEmail">公司 Email</label>
    <input class="f" id="gEmail" type="email" inputmode="email" autocomplete="email" placeholder="fin.chang@swag.live" required>
    <div class="err" id="gErr" role="alert"></div>
    <div class="acts"><button class="btn">進入字典</button></div>
  </form>
</div>

<div class="shell">
  <div class="blob" aria-hidden="true"></div>
  <header>
    <div class="logo">CS客服部門通用詞典</div>
    <nav role="tablist" id="nav"></nav>
    <button class="icon" id="setBtn" title="後台" aria-label="後台" hidden>⚙</button>
  </header>
  <main>
    <section class="hero">
      <h1 id="title"></h1>
      <p class="sub" id="desc"></p>
      <div class="search"><input id="q" type="search" autocomplete="off" aria-label="搜尋"><button type="button" class="qx" id="qx" aria-label="清除搜尋" title="清除搜尋（Esc）" hidden>✕</button><span id="cnt" style="font-size:12px;color:var(--mute);padding-right:12px"></span></div>
      <button class="btn" id="addBtn"></button>
      <div class="stat"><span class="dot off" id="dot"></span><span id="stat"></span></div>
    </section>
    <section class="list" id="list" aria-live="polite"></section>
  </main>
  <div class="ver" id="ver"></div>
</div>

<dialog id="dlg"><form method="dialog" id="form" autocomplete="off"></form></dialog>
<dialog id="adm">
  <button class="xbtn" type="button" data-close aria-label="關閉">✕</button>
  <h2>後台</h2>
  <div class="tabs" id="admTabs"><button data-at="logs">使用紀錄</button><button data-at="data">資料總覽</button><button data-at="dups">重複檢查</button><button data-at="people">人員權限</button></div>

const TONE = {2:'🏻',3:'🏼',4:'🏽',5:'🏾',6:'🏿'};
function emojify(s){   // :mega: → 📣；:+1::skin-tone-3: → 👍🏽；找不到的短代碼（公司自訂 emoji）保留原文
  s = String(s ?? ''); if(s.indexOf(':') < 0) return s;
  let out = '', i = 0;
  while(i < s.length){
    if(s[i] === ':'){
      const m = /^:([a-z0-9_+\-]+):/i.exec(s.slice(i, i + 60)), e = m && EMOJI[m[1].toLowerCase()];
      if(e){
        let r = e; i += m[0].length;
        const t = /^:skin-tone-([2-6]):/.exec(s.slice(i, i + 16));
        if(t){ r = r.replace(/\uFE0F/g, '') + TONE[t[1]]; i += t[0].length; }
        out += r; continue;
      }
    }
    out += s[i++];
  }
  return out;
}

}
function parseSender(text){   // 「Christine Lin  [下午 12:37]」→ @christine.lin，並回傳移除該行後的內文

  const m = lines[i].match(/^\s*([A-Za-z][A-Za-z.'’-]*(?:\s+[A-Za-z][A-Za-z.'’-]*)*)\s*\[[^\]]+\]\s*$/);

}

const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function hl(s, q){   // 轉義後，把搜尋關鍵字用 <mark> 標色（只標「包含」的字；縮寫／錯字比對不標）
  s = String(s ?? '');
  const toks = String(q || '').toLowerCase().split(/\s+/).map(t => t.replace(/[,，]+$/, '')).filter(Boolean);

  const re = new RegExp('(' + toks.sort((a, b) => b.length - a.length).map(reEsc).join('|') + ')', 'gi');
  return s.split(re).map((p, i) => i % 2 ? `<mark>${esc(p)}</mark>` : esc(p)).join('');
}

    return hl(p, q);
  }).join('');
}

/* ---------- 搜尋 ---------- */
/* 模糊搜尋：每個關鍵字依序比對 0 開頭相符 → 1 包含 → 2 字母依序出現（縮寫，如 fpd）→ 3 容許打錯 1–2 字（4 字以上）。
   多個關鍵字（以空白分隔）需全部符合；欄位可加權重（offset 越小越優先）。 */
const SEP = /[\s,，、.:_\-\/|｜@()（）\[\]]+/;
function lev(a, b){
  const d = Array.from({length:a.length+1}, (_, i) => [i, ...Array(b.length).fill(0)]);
  for(let j=1;j<=b.length;j++) d[0][j] = j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1]===b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function subseq(t, w){ let i = 0; for(const c of w){ if(c === t[i]) i++; if(i === t.length) return true; } return false; }
function tokScore(t, text){
  if(!text) return -1;
  const words = [text, ...text.split(SEP).filter(Boolean)];
  if(words.some(w => w.startsWith(t))) return 0;
  if(text.includes(t)) return 1;
  if(/^[\x00-\x7f]+$/.test(t)){
    if(t.length >= 3 && words.some(w => w[0] === t[0] && subseq(t, w))) return 2;
    if(t.length >= 4){ const k = t.length >= 7 ? 2 : 1; if(words.some(w => lev(t, w.slice(0, t.length)) <= k || lev(t, w) <= k)) return 3; }
  }
  return -1;
}
function fuzzy(q, fields){ // fields: [[文字, 權重offset], ...]；回傳分數（越小越符合），-1 = 不符合
  const toks = q.toLowerCase().split(/\s+/).map(t => t.replace(/[,，]+$/, '')).filter(Boolean);
  let total = 0;
  for(const t of toks){
    let best = -1;
    for(const [txt, off] of fields){ const sc = tokScore(t, String(txt || '').toLowerCase()); if(sc >= 0 && (best < 0 || sc + off < best)) best = sc + off; }
    if(best < 0) return -1; total += best;
  }
  return total;
}
function rank(rows, q, fn){
  if(!q) return rows;
  return rows.map((r, i) => ({r, i, s:fuzzy(q, fn(r))})).filter(x => x.s >= 0).sort((a, b) => a.s - b.s || a.i - b.i).map(x => x.r);
}

}

async function guardClose(){   // 有未儲存的內容時，先確認是否放棄
  const d = $('#dlg'), f = $('#form');

}
(() => {
  const d = $('#dlg'); let down = false;
  const outside = e => { const r = d.getBoundingClientRect(); return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom; };
  d.addEventListener('cancel', e => { if(isDirty($('#form'))){ e.preventDefault(); guardClose(); } });   // Esc
  d.addEventListener('pointerdown', e => { down = e.target === d && outside(e); });
  d.addEventListener('click', e => { if(down && e.target === d && outside(e)) guardClose(); down = false; });   // 點視窗外
  d.addEventListener('pointerdown', e => { if(!e.target.closest('.chipmenu')) d.querySelector('.chipmenu')?.remove(); }, true);
})();

function form({title, cols, v={}, onSave, onDelete, info='', back, after}){
  const d = $('#dlg'), f = $('#form');
  f.innerHTML = `<button class="xbtn" type="button" data-close aria-label="關閉">✕</button><h2>${esc(title)}</h2>${info}` + cols.map(c => fieldHtml(c, v)).join('') +
    `<div class="acts"><button class="btn" value="ok" id="saveBtn">儲存</button><button class="btn ghost" value="cancel" formnovalidate>取消</button>${back?'<button class="btn ghost" type="button" id="backBtn">← 返回修改</button>':''}${onDelete?'<button class="btn danger sp" type="button" id="delBtn">刪除</button>':''}</div>`;
  if(!d.open) d.showModal();
  d.querySelector('.chipmenu')?.remove();
  f.oninput = e => { const fl = e.target.closest('.fld'); if(fl){ fl.classList.remove('bad'); const er = fl.querySelector('.ferr'); if(er) er.textContent = ''; } };
  f.onsubmit = async e => {
    if(e.submitter?.value === 'cancel'){ e.preventDefault(); guardClose(); return; }
    e.preventDefault();
    const fd = new FormData(f), out = {}, miss = [];
    cols.forEach(c => {
      const k = c[0]; out[k] = (fd.get(k) || '').trim();
      const bad = !optOf(c) && !out[k], fl = f.querySelector(`.fld[data-k="${k}"]`);
      fl.classList.toggle('bad', bad); f.querySelector('#err_' + k).textContent = bad ? '此欄位為必填' : '';
      if(bad) miss.push(c);
    });
    if(miss.length){   // 由上而下引導：先帶到第一個沒填的欄位
      const first = miss[0], el = f.querySelector('#f_' + first[0]);
      toast(`還有 ${miss.length} 個必填欄位未填，請先填「${first[1].split('（')[0]}」`);
      el.scrollIntoView({block:'center', behavior:'smooth'}); el.focus({preventScroll:true}); return;
    }
    const sb = f.querySelector('#saveBtn'); sb.disabled = true;
    try{ if(await onSave(out) === true) d.close(); } finally { sb.disabled = false; }
  };
  const del = f.querySelector('#delBtn');
  if(del) del.onclick = async () => { if(confirm('確定刪除這筆資料？') && await onDelete() !== false) d.close(); };
  const bk = f.querySelector('#backBtn'); if(bk) bk.onclick = back;
  if(after) after(f);
  snapForm(f);
  const first = f.querySelector('.f'); if(first) first.focus({preventScroll:true});
}

const tkey = t => t.trim().toLowerCase();

/* 輸入 TAG 的欄位：即時拆成小標籤、停頓 0.4 秒比對重複；merge 有值時，提示框會附「合併到原有內容」按鈕 */
function wireTagInput(f, {id, exclude = () => [], merge = null, grow = false}){
  const ta = f.querySelector('#f_' + id), prev = f.querySelector('#prev_' + id), box = f.querySelector('#dupbox_' + id);
  let timer;
  const fit = () => { if(grow){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; } };
  const paint = () => {
    const dk = new Set(); conflicts(ta.value, exclude()).forEach(c => split(c.tag).forEach(x => dk.add(tkey(x))));
    const seen = new Set();
    prev.innerHTML = split(ta.value).filter(t => !seen.has(tkey(t)) && seen.add(tkey(t)))
      .map(t => `<span class="chip plain${dk.has(tkey(t)) ? ' dupc' : ''}"${dk.has(tkey(t)) ? ' title="字典裡已有此 TAG"' : ''}>${esc(t)}</span>`).join('');
  };
  const check = () => {
    const conf = conflicts(ta.value, exclude());
    if(!conf.length){ box.innerHTML = ''; return; }
    const names = esc(sharedTags(ta.value, conf).join('、'));
    if(merge){
      box.innerHTML = `<div class="dup hint" role="alert"><h4>已有相同的 TAG：${names}（${conf.length} 筆）</h4>${conf.map(entryHtml).join('')}<div class="row"><button class="mini go" type="button">合併到原有內容</button></div></div>`;
      box.querySelector('button').onclick = () => merge(conf);
    }else{
      box.innerHTML = `<div class="dup hint" role="alert"><h4>「${names}」已存在於另一筆資料</h4>${conf.map(entryHtml).join('')}<p class="note">同一個 TAG 只能出現在一筆資料中，請先移除再儲存。</p></div>`;
    }
  };
  ta.addEventListener('input', () => {
    if(grow && /\n/.test(ta.value)) ta.value = ta.value.replace(/\s*\n\s*/g, ', ');
    fit(); paint(); clearTimeout(timer); timer = setTimeout(check, 400);
  });
  if(grow) ta.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); f.requestSubmit(f.querySelector('#saveBtn')); } });
  fit(); paint(); check();
}

/* 合併：原有 TAG 唯讀；本次新增的 TAG 另填；多筆重複會合併成一筆 */
function tagMerge({conf, cur, back}){
  const base = conf[0], others = conf.slice(1), ids = conf.map(x => x.id);
  const existing = uniqTags(conf.map(c => c.tag).join(','));
  const exKeys = new Set(split(existing).map(tkey));
  const added = cur ? split(cur.tag).filter(t => !exKeys.has(tkey(t))).join(', ') : '';
  const uniq = k => [...new Set(conf.map(c => (c[k] || '').trim()).filter(Boolean))];
  const v = { tag:existing, newtag:added, translation:uniq('translation')[0] || '', related:uniq('related')[0] || '' };
  const notes = [];
  if(conf.length > 1) notes.push(`${conf.length} 筆現有資料會合併成一筆，所有原有 TAG 都會保留。`);

function enableDrag(f, st){
  const box = f.querySelector('#chipbox'), trash = f.querySelector('#trash'), hid = f.querySelector('#f_tag'), dlg = $('#dlg');
  let tags = split(st.row.tag), drag = null;
  const draw = () => { paintChips(box, tags, true); hid.value = tags.join(', '); };
  const over = e => { const r = trash.getBoundingClientRect(), m = 14; return e.clientX >= r.left - m && e.clientX <= r.right + m && e.clientY >= r.top - m && e.clientY <= r.bottom + m; };
  const askDel = async t => {
    if(tags.length <= 1){ toast('至少需保留一個 TAG；要刪除整筆資料請按下方「刪除」'); return; }
    const go = await ask({ title:'確定刪除這個 TAG？', ok:'確定刪除', cancel:'取消',
      html:`<p>要從這筆資料刪除 <b>${esc(t)}</b> 嗎？</p><p class="note">按下「確定刪除」後會立即更新 Google Sheet。</p>` });
    if(!go) return;
    const next = tags.filter(x => tkey(x) !== tkey(t)), nr = {...st.row, tag:next.join(', ')};
    if(await write('update', 'tags', nr)){ st.row = nr; tags = next; draw(); snapForm(f); toast('已刪除 TAG'); logS('tags', '刪除TAG', t); }
  };
  const showMenu = (c, t) => {
    dlg.querySelector('.chipmenu')?.remove();
    const r = c.getBoundingClientRect(), m = document.createElement('div');
    m.className = 'chipmenu'; m.innerHTML = `<button type="button">${TRASH}<span>刪除「${esc(t)}」</span></button>`;
    m.style.top = (r.bottom + 8) + 'px'; m.style.left = Math.max(8, Math.min(r.left, innerWidth - 230)) + 'px';
    m.querySelector('button').onclick = () => { m.remove(); askDel(t); };
    dlg.appendChild(m); navigator.vibrate?.(15);
  };
  box.addEventListener('contextmenu', e => e.preventDefault());
  draw();
  trash.onclick = () => toast('把上方的 TAG 拖曳到這裡即可刪除');
  box.addEventListener('pointerdown', e => {
    const c = e.target.closest('.chip[data-tag]'); if(!c || e.button > 0) return;
    drag = {c, t:c.dataset.tag, x:e.clientX, y:e.clientY, on:false, g:null, id:e.pointerId};
    try{ c.setPointerCapture(e.pointerId); }catch{}
    if(e.pointerType !== 'mouse') drag.lp = setTimeout(() => { if(drag && !drag.on) showMenu(drag.c, drag.t); }, 550);   // 長按：出現刪除選項
  });
  box.addEventListener('pointermove', e => {
    if(!drag || e.pointerId !== drag.id) return;
    if(!drag.on){
      if(Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
      drag.on = true; clearTimeout(drag.lp); const g = drag.c.cloneNode(true); g.className = 'chip dragghost'; g.removeAttribute('tabindex'); dlg.appendChild(g); drag.g = g; drag.c.style.opacity = .35;
    }
    drag.g.style.left = e.clientX + 'px'; drag.g.style.top = e.clientY + 'px';
    trash.classList.toggle('hot', over(e));
  });
  const end = e => {
    if(!drag || e.pointerId !== drag.id) return;
    const d0 = drag; drag = null; clearTimeout(d0.lp);
    if(d0.g) d0.g.remove(); d0.c.style.opacity = ''; trash.classList.remove('hot');
    if(d0.on && e.type === 'pointerup' && over(e)) askDel(d0.t);
  };
  box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
  box.addEventListener('keydown', e => { const c = e.target.closest('.chip[data-tag]'); if(c && (e.key === 'Delete' || e.key === 'Backspace')){ e.preventDefault(); askDel(c.dataset.tag); } });
}

function threadNew(v = {}, target = null){
  const st = {target, touched:!!target};
  form({ title: target ? '更新原有討論串' : '新增討論串', cols:F.threads, v,
    info: target ? `<div class="cfx"><p>正在更新既有的「<b>${esc(target.title)}</b>」。你沒填的內容會保留原樣，關鍵字維持原有文字，可直接修改。</p></div>` : '',
    onSave: async o => {

      if(dup && !target){ toast('已有相同標題或連結的討論串，已帶入更新畫面'); threadFromDup(o, dup); return false; }

      return false;
    },

function threadFromDup(cur, dup){   // 以原有資料為底，帶入使用者剛輸入的內容；關鍵字維持原有
  const m = {...dup}; ['title','platform','url','note','mention'].forEach(k => { if((cur[k] || '').trim()) m[k] = cur[k]; });
  threadNew(m, dup);
}
function wireThread(f, st){
  const title = f.querySelector('#f_title'), url = f.querySelector('#f_url'), note = f.querySelector('#f_note'), men = f.querySelector('#f_mention');
  f.querySelector('.fld[data-k="url"]').insertAdjacentHTML('afterend', '<div id="dupbox_th"></div>');
  const box = f.querySelector('#dupbox_th'); let timer;
  const check = () => {
    const cur = {title:title.value, url:url.value}, dup = findThreadDup(cur, st.target?.id);
    if(!dup){ box.innerHTML = ''; return; }
    const by = (norm(cur.url) && norm(dup.url) === norm(cur.url)) ? '連結網址' : '標題';
    box.innerHTML = `<div class="dup hint" role="alert"><h4>已有相同的${by}</h4><div class="it"><b>${esc(dup.title)}</b><br>${esc(dup.platform)}｜${esc(dup.mention)}｜${esc(cut(emojify(dup.note || ''), 60))}</div>` +
      (st.target ? '<p class="note">這會和另一筆既有討論串重複，請修改標題或連結。</p>' : '<div class="row"><button class="mini go" type="button">更新原有內容</button></div>') + '</div>';
    const b = box.querySelector('button'); if(b) b.onclick = () => threadFromDup(curValues(f), dup);
  };
  [title, url].forEach(el => el.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(check, 400); }));
  men.addEventListener('input', () => { st.touched = true; });     // 只有使用者手動輸入才會觸發；之後不再自動覆蓋
  wireEmoji(note, () => {
    if(st.touched) return;
    const r = parseSender(note.value); if(!r) return;
    const c = note.selectionStart, removed = note.value.length - r.rest.length;
    men.value = r.mention; men.closest('.fld').classList.remove('bad'); men.closest('.fld').querySelector('.ferr').textContent = '';
    note.value = r.rest; const p = Math.max(0, c - removed); note.setSelectionRange(p, p);
  });
  check();
}

let admClusters = [];
function tagClusters(){   // 以「共用 TAG」把彼此重複的資料歸成一組
  const rows = data.tags, parent = rows.map((_, i) => i), seen = {};
  const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
  rows.forEach((r, i) => split(r.tag).forEach(t => { const k = tkey(t); if(k in seen) parent[find(i)] = find(seen[k]); else seen[k] = i; }));
  const g = {}; rows.forEach((r, i) => (g[find(i)] ||= []).push(r));
  return Object.values(g).filter(a => a.length > 1);
}

  const open = b.classList.toggle('open'); a.classList.toggle('up', open); a.setAttribute('aria-expanded', open);

  if(!open) wrap.closest('article')?.scrollIntoView({block:'nearest', behavior:'smooth'});   // 收合後回到卡片位置
}
document.addEventListener('click', e => {
  const bd = e.target.closest('.body');   // 點內文文字 = 按右側 ▾；點連結或正在選取文字時不觸發
  if(bd && !e.target.closest('a') && !String(getSelection()).length){ toggleBody(bd.parentElement); return; }
  const t = e.target.closest('[data-m],[data-copy],[data-edit],[data-ev],[data-back],[data-addsub],[data-addkw],[data-addkwth],[data-toggle],[data-new],[data-close],[data-at],[data-aedit],[data-refresh],[data-padd],[data-pdel],[data-merge],[data-dedit],[data-collapse]');
  if(!t) return;
  const d = t.dataset;
  if(d.m){ mode=d.m; selEvent=null; location.hash=mode; $('#q').value=''; paintChrome(); render(); }
  else if(d.copy !== undefined){ if(d.copy){ copy(d.copy, d.msg).then(ok => ok && flashCopied(t)); logAct(d.act, d.ref); } }
  else if(d.edit) openEdit(mode, d.edit);
  else if(d.ev) openEvent(d.ev);
  else if(d.back !== undefined){ selEvent=null; render(); }
  else if(d.addsub) addSub(d.addsub);
  else if(d.addkw) addKwEvent(d.addkw);
  else if(d.addkwth) addKwThread(d.addkwth);
  else if(d.toggle !== undefined) toggleBody(t.parentElement);
  else if(d.collapse !== undefined) toggleBody(t.previousElementSibling);
  else if(d.new !== undefined) openNew($('#q').value.trim());
  else if(d.close !== undefined){ const dl = t.closest('dialog'); if(dl.id === 'dlg') guardClose(); else dl.close(); }
  else if(d.at){ admTab = d.at; renderAdm(); }
  else if(d.aedit) openEdit(admSheet, d.aedit);
  else if(d.merge !== undefined){ const c = admClusters[+d.merge]; if(c) tagMerge({conf:c, cur:null, back:null}); }
  else if(d.dedit){ const [sh, id] = d.dedit.split(':'); openEdit(sh, id); }
  else if(d.refresh !== undefined) renderAdm();
  else if(d.padd !== undefined){ const em = $('#pEmail').value.trim().toLowerCase(); const msg = checkEmail(em); if(msg){ toast(msg); return; } adminOp('admin_add', em, {role:$('#pRole').value}); }
  else if(d.pdel){ if(confirm('確定移除 ' + d.pdel + '？')) adminOp('admin_del', d.pdel); }
});
document.addEventListener('input', e => { if(e.target.id === 'admQ') fillTbl(); });
document.addEventListener('change', e => { if(e.target.id === 'admSheet'){ admSheet = e.target.value; fillTbl(); } });
let sTimer;
$('#q').addEventListener('input', () => { selEvent = null; render(); clearTimeout(sTimer); const v = $('#q').value.trim();
  if(LOG_SEARCH && v.length >= 2) sTimer = setTimeout(() => logAct('搜尋', v), 1500); });
$('#addBtn').onclick = () => openNew('');
const clearQ = () => { $('#q').value = ''; selEvent = null; render(); $('#q').focus(); };
$('#qx').onclick = clearQ;
$('#q').addEventListener('keydown', e => { if(e.key === 'Escape' && $('#q').value){ e.preventDefault(); clearQ(); } });
$('#setBtn').onclick = () => { admTab = 'logs'; $('#adm').showModal(); renderAdm(); };
document.addEventListener('visibilitychange', () => { if(!document.hidden && user && GAS_URL && !$('#dlg').open) load(); });
document.addEventListener('keydown', e => { if(e.key==='/' && user && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); $('#q').focus(); } });
window.addEventListener('hashchange', () => { const h=location.hash.slice(1); if(h in MODES && h!==mode){ mode=h; selEvent=null; paintChrome(); render(); } });

/* ---------- 信箱驗證 ---------- */
const SPECIAL = ['sam','bogi','lynn','pot','amy','bill.h','abby','maimai','suyu.c'];
function checkEmail(raw){
  const e = raw.trim().toLowerCase(), m = e.match(/^([^@\s]+)@swag\.live$/);
  if(!m) return '請填寫公司信箱（@swag.live），例如 fin.chang@swag.live';
  const l = m[1];
  if(SPECIAL.includes(l)) return '';
  if(/^\d+$/.test(l)) return '請填寫公司信箱：帳號不可為純數字';
  const p = l.split('.');
  if(p.length !== 2 || !p.every(s => /^[a-z]{2,}$/.test(s))) return '請填寫公司信箱：格式為「英文名.姓氏拼音@swag.live」';
  if(p.some(s => /^(.)\1+$/.test(s) || /(.)\1{2,}/.test(s))) return '請填寫公司信箱：帳號看起來不是真實姓名';
  return '';
}
function initGate(){
  const g = $('#gate'), inp = $('#gEmail'), err = $('#gErr');
  document.body.classList.add('locked');
  inp.value = ls.get('dict_email', ''); inp.focus();
  $('#gateForm').onsubmit = e => {
    e.preventDefault();
    const msg = checkEmail(inp.value);
    if(msg){ err.textContent = msg; inp.focus(); return; }
    user = inp.value.trim().toLowerCase(); ls.set('dict_email', user);
    err.textContent = ''; g.classList.add('out'); document.body.classList.remove('locked');
    setTimeout(() => g.hidden = true, 600);
    $('#setBtn').hidden = !isAdmin();
    load().then(() => logRaw('登入'));
  };
  inp.addEventListener('input', () => err.textContent = '');
}
$('#ver').textContent = APP + ' ' + VERSION;
console.info(APP, VERSION);
paintChrome(); render(); initGate();
